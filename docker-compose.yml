services:
  postgres:
    image: postgres:16
    container_name: bridgesat-postgres
    environment:
      POSTGRES_USER: bridgesat
      POSTGRES_PASSWORD: bridgesat
      POSTGRES_DB: bridgesat
    ports:
      - "5432:5432"
    volumes:
      - bridgesat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgesat -d bridgesat"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  bridgesat-pgdata:
