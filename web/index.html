<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <title>BridgeSAT</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Offline-first learning agent</p>
        <h1>BridgeSAT</h1>
        <p>Build a focused SAT study plan from a short diagnostic.</p>
        <div id="network-status" class="status" role="status">Checking connection…</div>
      </header>

      <section class="card" aria-labelledby="profile-title">
        <h2 id="profile-title">Create a learner profile</h2>
        <form id="profile-form">
          <label>
            Name
            <input id="name" required maxlength="80" value="Demo Student" />
          </label>
          <label>
            Minutes available today
            <input id="minutes" type="number" min="5" max="120" value="20" />
          </label>
          <button type="submit">Start diagnostic</button>
        </form>
      </section>

      <section id="diagnostic-card" class="card hidden" aria-labelledby="diagnostic-title">
        <h2 id="diagnostic-title">Quick diagnostic</h2>
        <div id="question-list"></div>
        <button id="submit-diagnostic" type="button">Build my plan</button>
      </section>

      <section id="result-card" class="card hidden" aria-labelledby="result-title">
        <h2 id="result-title">Agent plan</h2>
        <p id="agent-explanation"></p>
        <div id="mastery-list"></div>
        <ol id="plan-list"></ol>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
