<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <title>BridgeSAT</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Offline-first learning agent</p>
        <h1>BridgeSAT</h1>
        <p>Adaptive SAT practice that keeps working without a connection.</p>
        <div id="network-status" class="status" role="status">Checking connection…</div>
        <div id="sync-status" class="status" role="status"></div>
      </header>

      <section id="profile-card" class="card" aria-labelledby="profile-title">
        <h2 id="profile-title">Create a learner profile</h2>
        <form id="profile-form">
          <label>
            Name
            <input id="name" required maxlength="80" value="Demo Student" />
          </label>
          <label>
            Minutes available today
            <input id="minutes" type="number" min="5" max="120" value="20" />
          </label>
          <button type="submit">Start practicing</button>
        </form>
      </section>

      <section id="session-card" class="card hidden" aria-labelledby="session-title">
        <h2 id="session-title">Practice session</h2>
        <div id="mastery-list" class="mastery-list"></div>
        <div class="status" role="status">
          Pending sync: <strong id="pending-count">0</strong>
        </div>

        <div id="question-area">
          <p class="question-prompt"></p>
          <div class="question-choices"></div>
          <button id="hint-button" type="button">Show hint</button>
          <p id="hint-label" class="hint"></p>
          <p class="feedback"></p>
          <button type="button" class="next-button hidden">Next question</button>
        </div>

        <div id="session-summary" class="hidden">
          <h3>Session complete</h3>
          <p class="summary-text"></p>
          <button type="button" id="new-session-button">Start a new session</button>
        </div>
      </section>
    </main>
    <script src="/offline.js" defer></script>
    <script src="/offline-core.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
