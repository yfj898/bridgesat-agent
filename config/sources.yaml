schema_version: "1.0"
registry_version: "0.1.0"
last_verified: "2026-08-06"
human_registry: "docs/DATA_SOURCE_REGISTRY.md"

policy:
  default_decision: deny
  require_source_approval: true
  require_item_review_for_student_content: true
  require_license_snapshot: true
  require_content_hash: true
  require_attribution_record: true
  fail_closed_on_unknown_license: true
  fail_closed_on_expired_review: true
  review_validity_days: 180
  statuses:
    - approved
    - approved_with_item_review
    - candidate_generation_only
    - evaluation_only
    - manual_license_review_required
    - reference_only
    - prohibited
  actions:
    - external_link
    - taxonomy_reference
    - manual_reference
    - download
    - generate_candidates
    - transform
    - product_rag
    - offline_pack
    - redistribute
    - internal_evaluation
    - public_benchmark_reporting
    - model_training
    - model_testing

review_workflow:
  states:
    - discovered
    - source_review_pending
    - source_approved
    - item_review_pending
    - educational_review_pending
    - approved
    - rejected
    - withdrawn
  student_content_required_state: approved
  required_item_fields:
    - source_id
    - upstream_id
    - canonical_url
    - title
    - creator
    - rights_statement
    - license_id
    - fetched_at
    - content_hash
    - review_status
    - reviewer_id
    - attribution_text
    - content_version

